slam_toolbox:
  ros__parameters:
    use_sim_time: false

    scan_topic: /scan
    map_frame: map
    odom_frame: odom

    base_frame: base_footprint
    transform_timeout: 3.0
    throttle_scans: 1
    scan_queue_size: 200

    map_update_interval: 1.0
    resolution: 0.02

    minimum_time_interval: 0.1
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.02
