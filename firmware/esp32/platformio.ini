; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; 실제 로봇 보드: ESP32-S3-DevKitC-1
; main.cpp의 핀 배정(I2C 8/9, ToF XSHUT 4~6, 모터 10~13, PM UART 35/36, 팬 38)은
; S3 기준이다. 클래식 ESP32(esp32dev)에서는 GPIO6~11이 SPI 플래시 전용이고
; GPIO34~39는 입력 전용이라 이 핀 배정으로는 부팅/동작하지 않는다.
; ⚠️ 모듈이 Octal PSRAM 버전(N8R8, N16R8 등)이면 GPIO35~37을 쓸 수 없으니
;    모듈 각인을 확인할 것 (현재 PM 센서가 35/36 사용).

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
	6255
	6257
	6256
	1651
	1613
	bolderflight/Bolder Flight Systems MPU9250@^1.0.2
	bolderflight/Bolder Flight Systems Eigen@^3.0.0
	bolderflight/Bolder Flight Systems Unit Conversions@^5.0.0
	adafruit/Adafruit VL53L0X@^1.2.4
	adafruit/Adafruit SGP40 Sensor@^1.1.3
	cytrontechnologies/Cytron Motor Drivers Library@^1.0.1
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.15
lib_ignore =
	Morse
	Arduino-Relay
	RVLLogging

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

; 예전 설정(클래식 ESP32) — 참고용으로만 남겨둠. 현재 핀 배정과 맞지 않음.
[env:esp32dev]
board = esp32dev
